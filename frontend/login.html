<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Chat chít</title>
    <meta name="description" content="Sign in to your account.">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-bg"></div>
        <div class="auth-container">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="css/img/authss.png" alt="Chat chít" class="logo-img-sm">
                    <span>Chat chít</span>
                </a>
                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-subtitle">Sign in to your account to continue.</p>
            </div>

            <div class="auth-card">
                <div id="auth-message" class="auth-message" style="display:none;"></div>

                <!-- 3 phương thức đăng nhập -->
                <div class="auth-social-grid">
                    <button type="button" class="social-login google" onclick="handleGoogleLogin()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <path d="M21 12.3c0-.9-.1-1.7-.3-2.5H12v4.7h5.4c-.2 1.2-.8 2.1-1.7 2.8v2.2h2.7c1.6-1.4 2.6-3.7 2.6-6.2z"/>
                            <path d="M12 21c2.4 0 4.4-.8 5.8-2.2l-2.7-2.2c-.7.5-1.6.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H3.9v2.4C5.4 18.8 8.4 21 12 21z"/>
                            <path d="M6.9 13.7c-.2-.5-.3-1-.3-1.6s.1-1.1.3-1.6V8.1H3.9C3.4 9.3 3 10.6 3 12c0 1.4.4 2.7.9 3.9l3-2.2z"/>
                            <path d="M12 6.1c1.3 0 2.4.4 3.3 1.2l2.5-2.5C16.4 3.7 14.4 3 12 3 8.4 3 5.4 5.2 3.9 8.1l3 2.4C7.6 7.7 9.6 6.1 12 6.1z"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>
                    <button type="button" class="social-login phone" onclick="handlePhoneLogin()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <path d="M22 16.9c-.2 1.6-1.7 2.8-3.4 2.6-1.6-.2-3.1-.8-4.5-1.7-.7-.4-1.4-.8-2-1.2-.6-.4-1.2-.7-1.8-.9-.3-.1-.7-.2-1-.2-.4 0-.8.1-1.1.2-.5.2-.9.5-1.5.9C7.6 18.8 5.8 19.4 4.1 19.6 2.4 19.8.9 18.6.7 17c-.4-3.4 1.2-8.5 3.4-11.8.4-.6 1-1 1.7-1.1 1.5-.3 3 0 4.4.8.6.3 1.1.7 1.7 1.1.4.3.7.6 1 1 .4.4.8.8 1.1 1.2.4.5.7 1.1.8 1.7.2.5.2 1 .2 1.5 0 .4-.1.8-.2 1.1-.1.4-.3.8-.6 1.2-.4.5-.8.8-1.2 1.1-.3.2-.7.3-1.1.2-.5-.1-.9-.2-1.4-.6-.4-.3-.8-.7-1.3-1.1-.3-.2-.6-.5-.8-.7-.2-.2-.4-.4-.5-.6-.2-.2-.3-.4-.4-.6-.1-.3-.1-.6 0-.9.1-.4.3-.7.6-1 .3-.3.7-.5 1.1-.6.4-.1.8-.1 1.2 0 1.2.3 2.4.9 3.5 1.8 1.3 1.1 2.3 2.4 3 3.9.4.8.6 1.7.6 2.7Z"/>
                        </svg>
                        <span>Continue with Phone</span>
                    </button>
                </div>

                <div class="auth-divider">
                    <span class="auth-divider-line"></span>
                    <span class="auth-divider-text">or sign in with password</span>
                    <span class="auth-divider-line"></span>
                </div>

                <form id="login-form" class="auth-form" onsubmit="handleLogin(event)" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="usernameOrEmail">Username or Email</label>
                        <input class="form-input" type="text" id="usernameOrEmail" placeholder="Enter your username or email" required>
                        <span class="form-error" id="usernameOrEmail-error"></span>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-input" type="password" id="password" placeholder="Enter your password" required>
                        <span class="form-error" id="password-error"></span>
                    </div>
                    <button type="submit" id="login-submit" class="btn btn-primary btn-block btn-lg">
                        <span id="login-text">Sign In</span>
                        <span id="login-spinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create one</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
    function showMsg(m, t) {
        const el = document.getElementById('auth-message');
        el.style.display = 'flex';
        el.className = 'auth-message ' + (t || 'error');
        el.innerHTML = '<span>' + m + '</span>';
    }

    // === PHƯƠNG THỨC 1: Username + Password ===
    async function handleLogin(e) {
        e.preventDefault();
        const ue = document.getElementById('usernameOrEmail').value.trim();
        const pw = document.getElementById('password').value;
        const btn = document.getElementById('login-submit');
        const txt = document.getElementById('login-text');
        const spn = document.getElementById('login-spinner');

        document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
        let err = false;
        if (!ue) { document.getElementById('usernameOrEmail-error').textContent = 'Required'; err = true; }
        if (!pw) { document.getElementById('password-error').textContent = 'Required'; err = true; }
        if (err) return;

        btn.disabled = true; txt.style.display = 'none'; spn.style.display = 'inline-block';
        try {
            const d = await Auth.login(ue, pw);
            if (d.success) {
                showMsg('Login successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } else showMsg(d.message || 'Login failed', 'error');
        } catch (e) { showMsg(e.message || 'Cannot connect to server', 'error'); }
        finally { btn.disabled = false; txt.style.display = 'inline'; spn.style.display = 'none'; }
    }

    // === PHƯƠNG THỨC 2: Google OAuth (popup) ===
    const GOOGLE_CLIENT_ID = '648734465354-641229rk3kehq9rhmc10lfhcticrf2hr.apps.googleusercontent.com';

    async function handleGoogleLogin() {
        showMsg('Connecting to Google...', 'info');
        try {
            // Load Google Identity Services
            await new Promise((resolve, reject) => {
                if (window.google?.accounts) { resolve(); return; }
                const s = document.createElement('script');
                s.src = 'https://accounts.google.com/gsi/client';
                s.async = true;
                s.defer = true;
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });

            // Dùng Token Client với popup
            const accessToken = await new Promise((resolve, reject) => {
                const client = window.google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'openid email profile',
                    callback: (response) => {
                        if (response.access_token) {
                            resolve(response.access_token);
                        } else {
                            reject(new Error(response.error || 'No token'));
                        }
                    },
                });
                client.requestAccessToken();
                setTimeout(() => reject(new Error('Google login timeout')), 30000);
            });

            if (accessToken) {
                showMsg('Verifying with server...', 'info');
                const data = await ApiClient.post('/api/auth/google', { accessToken: accessToken });
                if (data.success) {
                    ApiClient.setAccessToken(data.accessToken);
                    sessionStorage.setItem(CONFIG.TOKEN.ACCESS_TOKEN_KEY, data.accessToken);
                    Auth._user = data.user;
                    Auth._notify();
                    showMsg('Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    showMsg(data.message || 'Google login failed', 'error');
                }
            }
        } catch (e) {
            console.error('Google login error:', e);
            showMsg('Lỗi: ' + (e.message || 'Google login failed'), 'error');
        }
    }

    // === PHƯƠNG THỨC 3: Số điện thoại (dùng backend API) ===
    async function handlePhoneLogin() {
        const phone = prompt('Enter your phone number (e.g., +84123456789):');
        if (!phone) return;
        
        showMsg('Sending verification code...', 'info');
        try {
            const data = await ApiClient.post('/api/auth/phone/send-code', { phone });
            if (data.success) {
                const code = prompt('Enter the verification code sent to your phone:');
                if (!code) return;
                
                const verifyData = await ApiClient.post('/api/auth/phone/verify', { phone, code });
                if (verifyData.success) {
                    ApiClient.setAccessToken(verifyData.accessToken);
                    sessionStorage.setItem(CONFIG.TOKEN.ACCESS_TOKEN_KEY, verifyData.accessToken);
                    Auth._user = verifyData.user;
                    Auth._notify();
                    showMsg('Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    showMsg(verifyData.message || 'Verification failed', 'error');
                }
            } else {
                showMsg(data.message || 'Failed to send code', 'error');
            }
        } catch (e) {
            console.error('Phone login error:', e);
            showMsg('Phone login is not available yet. Please use Google or password.', 'error');
        }
    }

    // Check if already logged in → redirect to index.html
    (async function() {
        try { 
            const ok = await Auth.init(); 
            if (ok) { 
                window.location.href = 'index.html'; 
                return; 
            } 
        } catch(e) {}
    })();
    </script>
    <script src="js/themes.js"></script>
</body>
</html>
