<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Chat chít</title>
    <meta name="description" content="Create your AuthGuard account.">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-bg"></div>
        <div class="auth-container">
            <div class="auth-header">
                <a href="index.html" class="auth-logo">
                    <img src="css/img/authss.png" alt="AuthGuard" class="logo-img-sm">
                    <span>Chat chít</span>
                </a>
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-subtitle">Start chatting free.</p>
            </div>

            <div class="auth-card">
                <div id="auth-message" class="auth-message" style="display:none;"></div>

                <div class="auth-social-grid">
                    <button type="button" class="social-login google" onclick="handleGoogleRegister()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <path d="M21 12.3c0-.9-.1-1.7-.3-2.5H12v4.7h5.4c-.2 1.2-.8 2.1-1.7 2.8v2.2h2.7c1.6-1.4 2.6-3.7 2.6-6.2z"/>
                            <path d="M12 21c2.4 0 4.4-.8 5.8-2.2l-2.7-2.2c-.7.5-1.6.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H3.9v2.4C5.4 18.8 8.4 21 12 21z"/>
                            <path d="M6.9 13.7c-.2-.5-.3-1-.3-1.6s.1-1.1.3-1.6V8.1H3.9C3.4 9.3 3 10.6 3 12c0 1.4.4 2.7.9 3.9l3-2.2z"/>
                            <path d="M12 6.1c1.3 0 2.4.4 3.3 1.2l2.5-2.5C16.4 3.7 14.4 3 12 3 8.4 3 5.4 5.2 3.9 8.1l3 2.4C7.6 7.7 9.6 6.1 12 6.1z"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>
                    <button type="button" class="social-login phone" onclick="handlePhoneRegister()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                            <path d="M22 16.9c-.2 1.6-1.7 2.8-3.4 2.6-1.6-.2-3.1-.8-4.5-1.7-.7-.4-1.4-.8-2-1.2-.6-.4-1.2-.7-1.8-.9-.3-.1-.7-.2-1-.2-.4 0-.8.1-1.1.2-.5.2-.9.5-1.5.9C7.6 18.8 5.8 19.4 4.1 19.6 2.4 19.8.9 18.6.7 17c-.4-3.4 1.2-8.5 3.4-11.8.4-.6 1-1 1.7-1.1 1.5-.3 3 0 4.4.8.6.3 1.1.7 1.7 1.1.4.3.7.6 1 1 .4.4.8.8 1.1 1.2.4.5.7 1.1.8 1.7.2.5.2 1 .2 1.5 0 .4-.1.8-.2 1.1-.1.4-.3.8-.6 1.2-.4.5-.8.8-1.2 1.1-.3.2-.7.3-1.1.2-.5-.1-.9-.2-1.4-.6-.4-.3-.8-.7-1.3-1.1-.3-.2-.6-.5-.8-.7-.2-.2-.4-.4-.5-.6-.2-.2-.3-.4-.4-.6-.1-.3-.1-.6 0-.9.1-.4.3-.7.6-1 .3-.3.7-.5 1.1-.6.4-.1.8-.1 1.2 0 1.2.3 2.4.9 3.5 1.8 1.3 1.1 2.3 2.4 3 3.9.4.8.6 1.7.6 2.7Z"/>
                        </svg>
                        <span>Continue with Phone</span>
                    </button>
                </div>

                <div class="auth-divider">
                    <span class="auth-divider-line"></span>
                    <span class="auth-divider-text">sign up with email</span>
                    <span class="auth-divider-line"></span>
                </div>

                <form id="register-form" class="auth-form" onsubmit="handleRegister(event)" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-input" type="text" id="username" name="username" placeholder="Choose a username" required autocomplete="username" minlength="3" maxlength="20">
                        <span class="form-hint">3-20 characters, letters, numbers, and underscores.</span>
                        <span class="form-error" id="username-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Gmail Address</label>
                        <input class="form-input" type="email" id="email" name="email" placeholder="you@gmail.com" required autocomplete="email">
                        <span class="form-error" id="email-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input class="form-input" type="password" id="password" name="password" placeholder="Create a strong password" required autocomplete="new-password" minlength="8">
                            <button type="button" class="password-toggle" onclick="togglePassword('password')" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                        <span class="form-hint">At least 8 characters.</span>
                        <span class="form-error" id="password-error"></span>
                    </div>

                    <button type="submit" id="register-submit" class="btn btn-primary btn-block btn-lg">
                        <span id="register-text">Create Account</span>
                        <span id="register-spinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
        }

        function showMessage(message, type) {
            const el = document.getElementById('auth-message');
            el.style.display = 'flex';
            el.className = 'auth-message ' + (type || 'error');
            const icons = {
                error: '<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>',
                success: '<circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/>',
            };
            el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">' + (icons[type] || icons.error) + '</svg><span>' + message + '</span>';
        }

        async function handleRegister(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('register-submit');
            const registerText = document.getElementById('register-text');
            const registerSpinner = document.getElementById('register-spinner');

            document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
            document.querySelectorAll('.form-input').forEach(el => el.classList.remove('error'));

            let hasError = false;
            if (!username || username.length < 3 || username.length > 20 || !/^[a-zA-Z0-9_]+$/.test(username)) {
                document.getElementById('username-error').textContent = 'Username must be 3-20 characters (letters, numbers, underscores).';
                document.getElementById('username').classList.add('error');
                hasError = true;
            }
            if (!email || !email.toLowerCase().endsWith('@gmail.com')) {
                document.getElementById('email-error').textContent = 'Only Gmail addresses (@gmail.com) are allowed.';
                document.getElementById('email').classList.add('error');
                hasError = true;
            }
            if (!password || password.length < 8) {
                document.getElementById('password-error').textContent = 'Password must be at least 8 characters.';
                document.getElementById('password').classList.add('error');
                hasError = true;
            }
            if (hasError) return;

            submitBtn.disabled = true;
            registerText.style.display = 'none';
            registerSpinner.style.display = 'inline-block';

            try {
                const data = await Auth.register(username, email, password);
                if (data.success) {
                    showMessage('Account created! Welcome to Chat chít.', 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                } else {
                    showMessage(data.message || 'Registration failed. Please try again.', 'error');
                }
            } catch (err) {
                showMessage(err.message || 'Cannot connect to server. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                registerText.style.display = 'inline';
                registerSpinner.style.display = 'none';
            }
        }

        // Check if already logged in
        setTimeout(async () => {
            try {
                const authenticated = await Auth.init();
                if (authenticated) window.location.href = 'index.html';
            } catch(e) {}
        }, 50);

        // Google Register - dùng Google OAuth popup (Token Client)
        const GOOGLE_CLIENT_ID = '648734465354-641229rk3kehq9rhmc10lfhcticrf2hr.apps.googleusercontent.com';

        async function handleGoogleRegister() {
            showMessage('Connecting to Google...', 'info');
            try {
                // Load Google Identity Services
                await new Promise((resolve, reject) => {
                    if (window.google?.accounts) { resolve(); return; }
                    const s = document.createElement('script');
                    s.src = 'https://accounts.google.com/gsi/client';
                    s.async = true;
                    s.defer = true;
                    s.onload = resolve;
                    s.onerror = reject;
                    document.head.appendChild(s);
                });

                // Dùng Token Client với popup - luôn mở popup Google OAuth
                const accessToken = await new Promise((resolve, reject) => {
                    const client = window.google.accounts.oauth2.initTokenClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: 'openid email profile',
                        callback: (response) => {
                            if (response.access_token) {
                                resolve(response.access_token);
                            } else {
                                reject(new Error(response.error || 'No token'));
                            }
                        },
                    });
                    client.requestAccessToken();
                    setTimeout(() => reject(new Error('Google sign up timeout')), 30000);
                });

                if (accessToken) {
                    showMessage('Verifying with server...', 'info');
                    console.log('[Google] Sending accessToken to backend, length:', accessToken.length);
                    try {
                        const data = await ApiClient.post('/api/auth/google', { accessToken: accessToken });
                        console.log('[Google] Backend response:', data);
                        if (data.success) {
                            ApiClient.setAccessToken(data.accessToken);
                            sessionStorage.setItem(CONFIG.TOKEN.ACCESS_TOKEN_KEY, data.accessToken);
                            Auth._user = data.user;
                            Auth._notify();
                            showMessage('Account created! Welcome to Chat chít.', 'success');
                            setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                        } else {
                            showMessage(data.message || 'Google sign up failed', 'error');
                        }
                    } catch (serverErr) {
                        console.error('Server error:', serverErr);
                        showMessage(serverErr.message || 'Server verification failed', 'error');
                    }
                }
            } catch (e) {
                console.error('Google sign up error:', e);
                showMessage('Lỗi: ' + (e.message || 'Google sign up failed'), 'error');
            }
        }

        // Phone Register
        async function handlePhoneRegister() {
            const phone = prompt('Enter your phone number (e.g., +84123456789):');
            if (!phone) return;
            
            showMessage('Sending verification code...', 'info');
            try {
                const data = await ApiClient.post('/api/auth/phone/send-code', { phone });
                if (data.success) {
                    const code = prompt('Enter the verification code sent to your phone:');
                    if (!code) return;
                    
                    const verifyData = await ApiClient.post('/api/auth/phone/verify', { phone, code });
                    if (verifyData.success) {
                        ApiClient.setAccessToken(verifyData.accessToken);
                        sessionStorage.setItem(CONFIG.TOKEN.ACCESS_TOKEN_KEY, verifyData.accessToken);
                        Auth._user = verifyData.user;
                        Auth._notify();
                        showMessage('Account created! Welcome to Chat chít.', 'success');
                        setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                    } else {
                        showMessage(verifyData.message || 'Verification failed', 'error');
                    }
                } else {
                    showMessage(data.message || 'Failed to send code', 'error');
                }
            } catch (e) {
                console.error('Phone sign up error:', e);
                showMessage('Phone sign up is not available yet. Please use Google or email.', 'error');
            }
        }
    </script>
    <script src="js/themes.js"></script>
</body>
</html>
