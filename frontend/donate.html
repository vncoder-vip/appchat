<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - AuthGuard</title>
    <meta name="description" content="Ủng hộ dự án AuthGuard.">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/themes.css">
    <style>
        .donate-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8);
            background: var(--color-bg-secondary);
        }
        .donate-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: var(--space-10);
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }
        .donate-card .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            margin-bottom: var(--space-6);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        .donate-card .back-link:hover {
            color: var(--color-primary-light);
        }
        .donate-card h1 {
            font-size: var(--font-size-3xl);
            font-weight: 700;
            margin-bottom: var(--space-2);
        }
        .donate-card .amount-display {
            font-size: var(--font-size-5xl);
            font-weight: 700;
            color: var(--color-primary-light);
            margin: var(--space-6) 0;
            padding: var(--space-4);
            background: var(--color-primary-bg);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .donate-card .qr-section {
            margin: var(--space-8) 0;
        }
        .donate-card .qr-section img {
            width: 280px;
            height: 280px;
            border-radius: var(--radius-lg);
            border: 2px solid var(--color-border);
            object-fit: cover;
            cursor: pointer;
            transition: transform var(--transition-base);
        }
        .donate-card .qr-section img:hover {
            transform: scale(1.02);
        }
        .donate-card .bank-info {
            text-align: left;
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            margin-top: var(--space-6);
        }
        .donate-card .bank-info h3 {
            font-size: var(--font-size-base);
            font-weight: 600;
            margin-bottom: var(--space-4);
            color: var(--color-text);
        }
        .donate-card .bank-info .info-row {
            display: flex;
            justify-content: space-between;
            padding: var(--space-2) 0;
            font-size: var(--font-size-sm);
            border-bottom: 1px solid var(--color-border);
        }
        .donate-card .bank-info .info-row:last-child {
            border-bottom: none;
        }
        .donate-card .bank-info .label {
            color: var(--color-text-tertiary);
        }
        .donate-card .bank-info .value {
            color: var(--color-text);
            font-weight: 500;
        }
        .donate-card .note {
            font-size: var(--font-size-sm);
            color: var(--color-text-tertiary);
            margin-top: var(--space-6);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="donate-page">
        <div class="donate-card">
            <a href="index.html#donate" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Quay lại
            </a>
            <h1>Ủng Hộ Dự Án</h1>
            <p style="color:var(--color-text-secondary);">Cảm ơn bạn đã ủng hộ! ❤️</p>

            <div class="amount-display" id="amount-display">0₫</div>

            <div class="qr-section">
                <img src="qrcode/donate-qr.png" alt="QR Code" onclick="openQRModal(this.src)">
                <p style="font-size:var(--font-size-sm);color:var(--color-text-tertiary);margin-top:var(--space-3);">Quét mã QR để chuyển khoản</p>
            </div>

            <div class="bank-info">
                <h3>Thông tin chuyển khoản</h3>
                <div class="info-row">
                    <span class="label">Ngân hàng</span>
                    <span class="value">MB Bank</span>
                </div>
                <div class="info-row">
                    <span class="label">Số tài khoản</span>
                    <span class="value">13337366778899</span>
                </div>
                <div class="info-row">
                    <span class="label">Chủ tài khoản</span>
                    <span class="value">Lê Gia Huy</span>
                </div>
                <div class="info-row">
                    <span class="label">Số tiền</span>
                    <span class="value" id="amount-info">0 VND</span>
                </div>
                <div class="info-row">
                    <span class="label">Nội dung</span>
                    <span class="value" id="content-info">DONATE</span>
                </div>
            </div>

            <p class="note">Vui lòng chuyển khoản đúng số tiền và nội dung để xác nhận giao dịch.</p>
        </div>
    </div>

    <!-- QR Modal -->
    <div id="qr-modal" class="qr-modal" onclick="closeQRModal()" style="display:none;">
        <div class="qr-modal-content" onclick="event.stopPropagation()">
            <button class="qr-modal-close" onclick="closeQRModal()">&times;</button>
            <img id="qr-modal-img" src="" alt="QR Code full size">
        </div>
    </div>

    <script src="js/themes.js"></script>
    <script>
        function openQRModal(src) {
            document.getElementById('qr-modal-img').src = src;
            document.getElementById('qr-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeQRModal() {
            document.getElementById('qr-modal').style.display = 'none';
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeQRModal();
        });

        // Get amount from URL
        const params = new URLSearchParams(window.location.search);
        const amount = parseInt(params.get('amount')) || 0;
        const formatted = amount.toLocaleString('vi-VN');

        document.getElementById('amount-display').textContent = formatted + '₫';
        document.getElementById('amount-info').textContent = formatted + ' VND';
        document.getElementById('content-info').textContent = 'DONATE ' + formatted + 'VND';
        document.title = 'Donate ' + formatted + '₫ - AuthGuard';
    </script>
</body>
</html>
